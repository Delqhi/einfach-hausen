name: Einfach Hausen quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, build, security and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Performance budgets
        run: npm run test:perf
      - name: Accessibility (axe)
        run: npm run test:a11y
      - name: Visual regression (website)
        run: npm run test:visual
      - name: Visual regression (apps)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:visual:apps
      - name: Security regressions
        run: npm run test:security
      - name: Deterministic fixture factory
        run: npm run test:fixtures
      - name: Domain regression suites
        run: |
          npm run test:intake
          npm run test:matching
          npm run test:onboarding
          npm run test:notifications
          npm run test:matching:t0107
          npm run test:matching:benchmark
          npm run test:review
      - name: CRM acceptance
        run: npm run test:crm
      - name: Architecture acceptance
        run: npm run test:e2e:architecture
      - name: Browser product acceptance
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e
      - name: Production smoke contract
        run: npm run test:smoke

  browser-matrix:
    name: browser acceptance (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx --yes playwright@1.62.1 install --with-deps ${{ matrix.browser }}
      - name: Browser product acceptance
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e
