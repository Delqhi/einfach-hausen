id: einfach_hausen_health
namespace: einfach.hausen

description: Private OCI health check for the Einfach Hausen app, scheduled by the existing Kestra instance.

tasks:
  - id: app_health
    type: io.kestra.plugin.core.http.Request
    uri: http://172.28.50.1:3010/api/health
    method: GET

  - id: health_marker
    type: io.kestra.plugin.core.log.Log
    message: "Einfach Hausen OCI health check succeeded at {{ execution.startDate }}"

triggers:
  - id: every_ten_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    allowConcurrent: false
